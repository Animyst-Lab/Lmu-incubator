<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/tokens.css">
  <style>
    /* Starter styles that match the Lion Share site. Reuse these classes. */
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      background: var(--surface);
      color: var(--ink);
      font-family: var(--font-sans);
      line-height: 1.5;
    }
    h2, h3 { font-family: var(--font-display); font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; margin: 0 0 8px; }
    h2 { font-size: 1.5rem; }
    h3 { font-size: 1.125rem; }
    p { margin: 0 0 16px; color: var(--muted); }
    button { font: inherit; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* Small uppercase label above a heading */
    .eyebrow { display: block; margin-bottom: 8px; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent-strong); }

    /* Cards: .card on light, .card-dark for one standout card */
    .card { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-card-sm); padding: 24px; }
    .card-dark { background: var(--ink-card); color: #fff; border-radius: var(--radius-card-sm); padding: 24px; }
    .card-dark p { color: #d6d6d6; }
    .card-dark .eyebrow { color: var(--accent-from); }

    /* Pill buttons: .btn for the main action, .btn-light for the rest */
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      border: 0; border-radius: var(--radius-pill); padding: 14px 28px;
      background: var(--ink-card); color: #fff; font-size: 0.875rem; font-weight: 500;
      cursor: pointer; transition: transform 0.3s var(--ease-snap);
    }
    .btn:hover { transform: scale(1.04); }
    .btn-light { background: var(--surface); color: var(--ink); border: 1px solid var(--border); }

    /* Chips and toggles: add aria-pressed="true" for the selected state */
    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      border: 1px solid var(--border); border-radius: var(--radius-pill); padding: 6px 14px;
      background: var(--bg); color: var(--ink); font-size: 0.875rem; font-weight: 500; cursor: pointer;
    }
    .chip[aria-pressed="true"] { background: var(--ink-card); border-color: var(--ink-card); color: #fff; }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 20px; }
    .chip { transition: transform 0.3s var(--ease-snap); }
    .chip:hover { transform: scale(1.04); }
    .amount { font-size: 2.5rem; font-weight: 600; letter-spacing: -0.02em; color: var(--accent-from); margin: 0 0 4px; }
    .source { font-size: 0.8125rem; color: var(--muted); margin: 12px 0 0; }
    .wrap { max-width: 640px; margin: 0 auto; }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <span class="eyebrow">Your gift at work</span>
    <h2>What does a donation to Heal the Bay do?</h2>
    <p>Pick an amount to see what it can make possible.</p>
    <div class="chips" role="group" aria-label="Donation amount">
      <button class="chip" type="button" data-i="0" aria-pressed="true">$25</button>
      <button class="chip" type="button" data-i="1" aria-pressed="false">$50</button>
      <button class="chip" type="button" data-i="2" aria-pressed="false">$100</button>
      <button class="chip" type="button" data-i="3" aria-pressed="false">$500</button>
    </div>
    <div class="card-dark" aria-live="polite">
      <span class="eyebrow">Can make possible</span>
      <p class="amount" id="amount">$25</p>
      <p id="impact" style="margin:0"></p>
    </div>
    <p class="source">Amounts and impacts are from Heal the Bay's donate page.</p>
  </div>
  <script>
    const impacts = [
      ["$25", "Feeding the Heal the Bay Aquarium animals for one day."],
      ["$50", "Training and equipping two volunteers to survey Marine Protected Areas."],
      ["$100", "One week of water quality data collection for California beaches."],
      ["$500", "Subsidizing a community cleanup for 60 volunteers."]
    ];
    const chips = document.querySelectorAll(".chip");
    function show(i) {
      chips.forEach((c, j) => c.setAttribute("aria-pressed", String(i === j)));
      document.getElementById("amount").textContent = impacts[i][0];
      document.getElementById("impact").textContent = impacts[i][1];
    }
    chips.forEach(c => c.addEventListener("click", () => show(Number(c.dataset.i))));
    show(0);
  </script>
</body>
</html>
