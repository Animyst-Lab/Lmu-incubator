<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;600&display=swap">
  <link rel="stylesheet" href="/tokens.css">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      background: var(--surface);
      color: var(--ink);
      font-family: var(--font-sans);
      line-height: 1.5;
    }
    h2 {
      font-family: var(--font-display);
      font-size: 1.5rem;
      line-height: 1.2;
      margin: 0 0 8px;
    }
    p { margin: 0 0 16px; color: var(--muted); }
    .card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 20px;
    }
    .amount {
      font-family: var(--font-display);
      font-size: 2.5rem;
      color: var(--accent-strong);
      margin: 0;
    }
    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      margin: 12px 0 4px;
    }
    .result { font-size: 1.125rem; color: var(--ink); margin: 12px 0 0; }
    .result strong { color: var(--accent-strong); }
    .plates {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(18px, 1fr));
      gap: 6px;
      margin-top: 16px;
    }
    .plate {
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--accent);
      transform: scale(0);
      animation: pop 0.25s ease-out forwards;
    }
    @keyframes pop { to { transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) {
      .plate { animation: none; transform: none; }
    }
    .people { display: flex; gap: 12px; margin: 12px 0; }
    .person { width: 44px; height: 64px; }
    .person circle, .person rect { fill: var(--border); }
    .person.highlight circle, .person.highlight rect { fill: var(--accent); }
    .fine { font-size: 0.8125rem; margin: 12px 0 0; }
  </style>
</head>
<body>
  <div class="card">
    <h2>One in four</h2>
    <p>That's how many people in LA County experience food insecurity, according to the Food Bank.</p>
    <div class="people" aria-hidden="true">
      <svg class="person highlight" viewBox="0 0 44 64"><circle cx="22" cy="14" r="12"/><rect x="6" y="30" width="32" height="34" rx="12"/></svg>
      <svg class="person" viewBox="0 0 44 64"><circle cx="22" cy="14" r="12"/><rect x="6" y="30" width="32" height="34" rx="12"/></svg>
      <svg class="person" viewBox="0 0 44 64"><circle cx="22" cy="14" r="12"/><rect x="6" y="30" width="32" height="34" rx="12"/></svg>
      <svg class="person" viewBox="0 0 44 64"><circle cx="22" cy="14" r="12"/><rect x="6" y="30" width="32" height="34" rx="12"/></svg>
    </div>
  </div>

  <div class="card">
    <h2>What would your gift do?</h2>
    <label for="gift">Slide to pick an amount</label>
    <p class="amount" id="amount" aria-live="polite">$25</p>
    <input id="gift" type="range" min="5" max="100" step="5" value="25">
    <p class="result" id="result"></p>
    <div class="plates" id="plates" aria-hidden="true"></div>
    <p class="fine">Based on the Food Bank's figure that $25 helps provide the equivalent of up to 100 meals.</p>
  </div>

  <script>
    const MEALS_PER_DOLLAR = 100 / 25;
    const slider = document.getElementById("gift");
    const amount = document.getElementById("amount");
    const result = document.getElementById("result");
    const plates = document.getElementById("plates");

    function update() {
      const dollars = Number(slider.value);
      const meals = dollars * MEALS_PER_DOLLAR;
      amount.textContent = "$" + dollars;
      result.innerHTML = "Up to <strong>" + meals + " meals</strong> for neighbors in LA County.";
      // One dot per 5 meals keeps the grid readable at $100.
      const dots = meals / 5;
      plates.replaceChildren(
        ...Array.from({ length: dots }, (_, i) => {
          const dot = document.createElement("span");
          dot.className = "plate";
          dot.style.animationDelay = i * 15 + "ms";
          return dot;
        })
      );
    }

    slider.addEventListener("input", update);
    update();
  </script>
</body>
</html>
